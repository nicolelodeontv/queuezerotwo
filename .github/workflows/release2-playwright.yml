name: Release 2 Playwright
# Release 2 regression + database replay v3

# Local Supabase uses fixed host ports; serialize runs to avoid port collisions.
concurrency:
  group: release2-playwright-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  release2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:css
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Supabase CLI version
        run: supabase --version
      - name: Start local Supabase
        shell: bash
        run: |
          test -f supabase/migrations/20261008070000_enable_pg_cron.sql
          supabase start --exclude studio,mailpit,logflare,vector,postgres-meta,gotrue,imgproxy,kong,postgrest,realtime,storage-api,supavisor,edge-runtime
      - name: Replay all migrations
        shell: bash
        run: supabase db reset
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run Release 2 database replay checks
        shell: bash
        run: |
          supabase status -o env > /tmp/queuezerotwo-supabase.env
          set -a
          source /tmp/queuezerotwo-supabase.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/release2-db-replay.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop || true
      - name: Check inline app JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path("index.html").read_text(encoding="utf-8")
          start = h.find("<script>\nconst K=")
          end = h.find("</script>", start)
          if start < 0 or end < 0:
            raise SystemExit("main inline script not found")
          Path("/tmp/queuezerotwo-inline.js").write_text(h[start+8:end], encoding="utf-8")
          PY
          node --check /tmp/queuezerotwo-inline.js
      - name: Test partner rotation logic
        run: node tests/partner-rotation.mjs
      - name: Test rest-aware Live View queue and wait estimates
        run: node tests/live-view-queue.mjs
      - name: Test progressive post-game queue reshuffle
        run: node tests/queue-return-rotation.mjs
      - name: Verify live Production alias matches current main
        shell: bash
        run: bash tests/production-serving-check.sh
      - name: Verify unique service-worker cache allocations
        run: node tests/service-worker-cache-versions.mjs
      - name: Check Preview configuration build script
        run: node --check scripts/configure-preview.mjs
      - name: Test Production and Preview CSP rules
        run: node tests/vercel-config.mjs
      - name: Test Preview backend guard
        run: node tests/configure-preview.mjs
      - name: Check Release 2 Playwright test syntax
        run: node --check tests/release2b-sessions.mjs
      - name: Check real-device test syntax
        run: node --check tests/browserstack-release1.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: nohup python3 -m http.server 4173 >/tmp/queuezerotwo-http.log 2>&1 &
      - name: Run Release 2 Playwright smoke
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/release2b-sessions.mjs
      - name: Check Nyork two-browser integration test syntax
        run: node --check tests/nyork-two-browser-live.mjs
      - name: Run Nyork Broadcast, hostile-input, and reconnect tests (3 PR repeats; 10 nightly/manual)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          APP_URL: http://127.0.0.1:4173/
          NYORK_SUPABASE_URL: https://yeytqiyhosoyuassjcef.supabase.co
          NYORK_SUPABASE_PUBLISHABLE_KEY: sb_publishable_k41MPtlaBwnddBd6QIutTQ_kMWbeN7T
          NYORK_REPEAT_COUNT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '10' || '3' }}
          NYORK_BROADCAST_ITERATIONS: '2'
        run: node tests/nyork-two-browser-live.mjs
      - name: Skip Nyork integration for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Skipping the Nyork write-capable integration test for an outside fork."
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release2b-playwright-debug
          path: artifacts/playwright-debug/
          if-no-files-found: warn
          retention-days: 7
      - name: Sweep mobile, tablet, and desktop viewport widths
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/responsive-viewport-sweep.mjs
      - name: Check Next-Up preview and mobile test syntax
        run: node --check tests/next-up-preview-mobile.mjs
      - name: Test Next-Up preview and mobile responsiveness
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/next-up-preview-mobile.mjs
      - name: Check Live View following-group test syntax
        run: node --check tests/live-view-next-up-preview.mjs
      - name: Test upcoming groups in shared Live View
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/live-view-next-up-preview.mjs
      - name: Check 320px light/dark visual test syntax
        run: node --check tests/responsive-320-themes.mjs
      - name: Run 320px light/dark menu and layout checks
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/responsive-320-themes.mjs
      - name: Upload 320px theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-320-theme-check
          path: artifacts/320-theme-check/
          if-no-files-found: warn
          retention-days: 7
      - name: Stress test 320px first-load layout with blocked and loaded fonts
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: |
          for attempt in $(seq 1 15); do
            if (( attempt % 2 == 1 )); then
              font_mode=blocked
            else
              font_mode=enabled
            fi
            echo "320px cold load $attempt/15 (Google Fonts: $font_mode)"
            node tests/responsive-viewport-sweep.mjs --only-320 --font-mode="$font_mode" || exit $?
          done
