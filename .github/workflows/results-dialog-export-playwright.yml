name: Results Dialog Export Playwright

on:
  push:
    branches:
      - feature/results-dialog-export

permissions:
  contents: read

concurrency:
  group: results-dialog-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  results-dialog-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:css
      - name: Audit production dependencies only
        run: npm audit --omit=dev
      - name: Check Release 2 Playwright test syntax
        run: node --check tests/release2b-sessions.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: nohup python3 -m http.server 4173 >/tmp/queuezerotwo-http.log 2>&1 &
      - name: Run local Playwright smoke suite
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/release2b-sessions.mjs
